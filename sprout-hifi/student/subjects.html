<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Sprout · Choose a subject</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/student.css">
<style>
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; flex: 1; }
  .tile {
    position: relative; min-height: 210px; border-radius: var(--r-xl); padding: 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    text-decoration: none; color: var(--text); border: 2px solid transparent;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); border-color: rgba(43, 37, 96, .15); }
  .tile .ico {
    width: 92px; height: 92px; border-radius: 28px; background: var(--surface);
    display: grid; place-items: center; box-shadow: var(--shadow-1);
  }
  .tile .ico .i { width: 46px; height: 46px; stroke-width: 1.75; }
  .tile b { font-size: 26px; font-weight: 700; }
  .tile .k-badge { position: absolute; top: 16px; right: 16px; }
  .t-ind { background: var(--indigo-50); } .t-ind .i { color: var(--indigo); }
  .t-apr { background: var(--apricot-100); } .t-apr .i { color: #B3541F; }
  .t-mint { background: var(--mint-100); } .t-mint .i { color: var(--mint-700); }
  .hello { display: flex; align-items: center; gap: 14px; }
  @media (max-width: 860px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tile { min-height: 170px; } .tile .ico { width: 72px; height: 72px; } }
</style>
</head>
<body class="kid">
<main class="k-wrap">
  <header class="k-top">
    <div class="grow hello">
      <span class="avatar" aria-hidden="true">L</span>
      <div>
        <h1 data-i18n="subjects.hi">Hi Lina! Pick a subject</h1>
        <p class="muted" data-i18n="subjects.class">Class 3B</p>
      </div>
    </div>
    <div class="notif-wrap">
      <button class="k-icon" id="bell" aria-label="Notifications" data-i18n-label="nav.notif" aria-expanded="false"><i data-lucide="bell"></i><span class="dot">3</span></button>
      <div class="notif" id="notifPanel" hidden>
        <h3 data-i18n="notif.teachers">From your teachers</h3>
        <a href="results.html"><span class="n-ico mint"><i data-lucide="check-check" class="i-sm"></i></span><span><p data-i18n-html="notif.checkedWeber">Frau Weber checked your <b>Math Test 3</b>.</p><small data-i18n="time.900">Today, 9:00</small></span></a>
        <a href="mistakes.html"><span class="n-ico apr"><i data-lucide="sprout" class="i-sm"></i></span><span><p data-i18n-html="notif.practice">New practice for you: <b>borrowing from the tens</b>.</p><small data-i18n="time.901">Today, 9:01</small></span></a>
        <a href="messages.html"><span class="n-ico"><i data-lucide="message-circle" class="i-sm"></i></span><span><p data-i18n="notif.sticker">Frau Weber sent you a sticker.</p><small data-i18n="time.902">Today, 9:02</small></span></a>
      </div>
    </div>
    <a class="k-icon" href="../index.html" aria-label="Log out" data-i18n-label="nav.logout"><i data-lucide="log-out"></i></a>
  </header>

  <section class="tiles" aria-label="Subjects" data-i18n-label="subjects.label">
    <a class="tile t-ind" href="home.html"><span class="k-badge" data-i18n="badge.5new">5 new</span><span class="ico"><i data-lucide="calculator"></i></span><b data-i18n="subj.math">Math</b></a>
    <a class="tile t-mint" href="home.html"><span class="ico"><i data-lucide="flask-conical"></i></span><b data-i18n="subj.science">Science</b></a>
    <a class="tile t-apr" href="home.html"><span class="k-badge" data-i18n="badge.1new">1 new</span><span class="ico"><i data-lucide="book-open"></i></span><b data-i18n="subj.german">German</b></a>
    <a class="tile t-apr" href="home.html"><span class="ico"><i data-lucide="message-square-text"></i></span><b data-i18n="subj.english">English</b></a>
    <a class="tile t-ind" href="home.html"><span class="ico"><i data-lucide="palette"></i></span><b data-i18n="subj.art">Art</b></a>
    <a class="tile t-mint" href="home.html"><span class="ico"><i data-lucide="music"></i></span><b data-i18n="subj.music">Music</b></a>
  </section>
</main>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/student.js"></script>
</body>
</html>
