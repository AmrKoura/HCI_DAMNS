<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Sprout · Submit exam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/student.css">
<style>
  .sub-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 24px; flex: 1; }
  .left { display: flex; flex-direction: column; gap: 16px; }
  .cam {
    position: relative; flex: 1; min-height: 360px; border-radius: var(--r-xl); overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #3A3380 0%, #1E1A3C 70%);
    display: flex; align-items: center; justify-content: center;
  }
  .guide {
    position: relative; width: min(60%, 300px); aspect-ratio: 3 / 4; max-width: 100%;
    background: rgba(255, 255, 255, .92); border-radius: 6px;
    display: flex; flex-direction: column; gap: 10px; padding: 22px 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .35);
  }
  .guide span { display: block; height: 8px; border-radius: 4px; background: #D9D6E8; }
  .guide span:nth-child(odd) { width: 80%; } .guide span:nth-child(even) { width: 60%; }
  .corner { position: absolute; width: 34px; height: 34px; border: 4px solid var(--apricot); }
  .c1 { top: -10px; left: -10px; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; }
  .c2 { top: -10px; right: -10px; border-left: 0; border-bottom: 0; border-radius: 0 10px 0 0; }
  .c3 { bottom: -10px; left: -10px; border-right: 0; border-top: 0; border-radius: 0 0 0 10px; }
  .c4 { bottom: -10px; right: -10px; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }
  .cam-tip { position: absolute; top: 16px; left: 16px; display: flex; gap: 8px; align-items: center; padding: 8px 14px; border-radius: 999px; background: rgba(255, 255, 255, .14); color: #fff; font-size: 15px; }
  .shutter {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    width: 78px; height: 78px; border-radius: 50%; border: 5px solid #fff; background: var(--apricot); color: var(--indigo);
    display: grid; place-items: center; cursor: pointer; transition: transform .1s ease;
  }
  .shutter:active { transform: translateX(-50%) scale(.94); }
  .drop {
    flex: 1; min-height: 360px; border-radius: var(--r-xl); border: 3px dashed var(--line-strong); background: var(--surface);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px;
    transition: border-color .15s ease, background .15s ease;
  }
  .drop.over { border-color: var(--apricot); background: var(--apricot-100); }
  .drop .big { width: 84px; height: 84px; border-radius: 26px; background: var(--indigo-50); color: var(--indigo); display: grid; place-items: center; }
  .drop b { font-size: 22px; }
  .pages { display: flex; flex-direction: column; gap: 12px; }
  .page { display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: var(--r-lg); border: 1.5px solid var(--line); background: var(--surface); }
  .page.bad { border-color: var(--unsure); background: var(--unsure-100); }
  .thumb { width: 58px; height: 74px; border-radius: 8px; background: #fff; border: 1px solid var(--line); flex-shrink: 0; padding: 8px 6px; display: flex; flex-direction: column; gap: 5px; }
  .thumb i { display: block; height: 4px; border-radius: 2px; background: #D9D6E8; }
  .page.bad .thumb { filter: blur(1.2px); }
  .page .grow { flex: 1; min-width: 0; }
  .page b { font-size: 17px; display: block; }
  .ok { color: var(--mint-700); font-weight: 600; font-size: 15px; display: inline-flex; gap: 6px; align-items: center; }
  .warn { color: var(--unsure); font-weight: 600; font-size: 15px; display: inline-flex; gap: 6px; align-items: center; }
  .side { display: flex; flex-direction: column; gap: 16px; }
  .helper { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md); background: var(--indigo-50); color: var(--indigo-700); font-size: 15px; }
  @media (max-width: 860px) { .sub-grid { grid-template-columns: 1fr; } .cam, .drop { min-height: 300px; } }
</style>
</head>
<body class="kid">
<main class="k-wrap">
  <header class="k-top">
    <a class="k-icon" href="home.html" aria-label="Back" data-i18n-label="nav.back"><i data-lucide="arrow-left"></i></a>
    <div class="grow">
      <h1 data-i18n="test.t4">Math Test 4 · Shapes</h1>
      <p class="muted" data-i18n="submit.due">Due Thursday 15 October</p>
    </div>
  </header>

  <div class="sub-grid">
    <section class="left" aria-label="Add your pages" data-i18n-label="submit.add">
      <div class="seg" role="group" aria-label="How to add pages" data-i18n-label="submit.how">
        <button type="button" id="modeCam" aria-pressed="true"><i data-lucide="camera" class="i-sm"></i><span data-i18n="submit.camera">Use camera</span></button>
        <button type="button" id="modeFile" aria-pressed="false"><i data-lucide="upload" class="i-sm"></i><span data-i18n="submit.upload">Upload photos</span></button>
      </div>

      <div class="cam" id="camView">
        <span class="cam-tip"><i data-lucide="sun" class="i-sm"></i><span data-i18n="submit.tip">Hold still, good light</span></span>
        <div class="guide" aria-label="Fit the whole page inside the corners" data-i18n-label="submit.fit">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          <b class="corner c1"></b><b class="corner c2"></b><b class="corner c3"></b><b class="corner c4"></b>
        </div>
        <button class="shutter" id="shutter" aria-label="Take photo" data-i18n-label="submit.shutter"><i data-lucide="camera" class="i-lg"></i></button>
      </div>

      <label class="drop" id="dropView" for="fileInput" hidden>
        <span class="big"><i data-lucide="image-up" class="i-lg"></i></span>
        <b data-i18n="submit.drag">Drag your photos here</b>
        <span class="muted" data-i18n="submit.or">or</span>
        <span class="btn btn-primary btn-lg" data-i18n="submit.choose">Choose from my photos</span>
        <span class="muted" style="font-size:14px" data-i18n="submit.types">Photos or PDF · one page per photo</span>
        <input type="file" id="fileInput" accept="image/*,application/pdf" multiple hidden>
      </label>
    </section>

    <aside class="side" aria-label="My pages" data-i18n-label="submit.myPages">
      <div class="k-card k-pad" style="display:flex;flex-direction:column;gap:14px">
        <div class="k-title" style="margin:0"><h2 data-i18n="submit.myPages">My pages</h2><span class="pill" id="pageCount">2 pages</span></div>
        <div class="pages" id="pages"></div>
        <button class="btn btn-ghost btn-block" id="addPage"><i data-lucide="plus" class="i-sm"></i><span data-i18n="submit.addPage">Add a page</span></button>
      </div>
      <div class="helper"><i data-lucide="hand-heart" class="i-sm"></i><span data-i18n="submit.help">A teacher or a grown-up at home can help you, or send it for you.</span></div>
      <a class="btn btn-primary btn-lg btn-block" id="sendBtn" href="waiting.html"><i data-lucide="send" class="i-sm"></i><span data-i18n="submit.send">Send to my teacher</span></a>
    </aside>
  </div>
</main>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/student.js"></script>
<script>
  var pages = [{ ok: true }, { ok: false }];
  function pageName(i) { return i18n("submit.page", { n: i + 1 }); }

  function render() {
    var box = document.getElementById("pages");
    box.innerHTML = "";
    pages.forEach(function (p, i) {
      var name = pageName(i);
      var row = document.createElement("div");
      row.className = "page" + (p.ok ? "" : " bad");
      row.innerHTML =
        '<span class="thumb"><i></i><i></i><i></i><i></i><i></i><i></i></span>' +
        '<span class="grow"><b>' + name + '</b>' +
        (p.ok ? '<span class="ok"><i data-lucide="circle-check" class="i-sm"></i>' + i18n("submit.clear") + '</span>'
              : '<span class="warn"><i data-lucide="triangle-alert" class="i-sm"></i>' + i18n("submit.blurry") + '</span>') +
        '</span>' +
        (p.ok ? '<button class="icon-btn" aria-label="' + i18n("submit.remove", { p: name }) + '" data-del="' + i + '"><i data-lucide="trash-2" class="i-sm"></i></button>'
              : '<button class="btn btn-accent" data-retake="' + i + '"><i data-lucide="camera" class="i-sm"></i>' + i18n("submit.again") + '</button>');
      box.appendChild(row);
    });
    document.getElementById("pageCount").textContent = i18n(pages.length === 1 ? "submit.pages1" : "submit.pagesN", { n: pages.length });
    var bad = pages.some(function (p) { return !p.ok; });
    var send = document.getElementById("sendBtn");
    send.setAttribute("aria-disabled", bad || !pages.length ? "true" : "false");
    send.style.opacity = bad || !pages.length ? ".5" : "1";
    refreshIcons();
  }

  document.getElementById("pages").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.retake) { pages[+b.dataset.retake].ok = true; toast(i18n("submit.niceToast")); }
    if (b.dataset.del) { pages.splice(+b.dataset.del, 1); }
    render();
  });

  function addPage() { pages.push({ ok: true }); render(); }
  document.getElementById("shutter").addEventListener("click", function () { addPage(); toast(i18n("submit.addedToast", { n: pages.length })); });
  document.getElementById("addPage").addEventListener("click", function () {
    if (document.getElementById("modeFile").getAttribute("aria-pressed") === "true") document.getElementById("fileInput").click();
    else addPage();
  });

  function setMode(cam) {
    document.getElementById("modeCam").setAttribute("aria-pressed", cam ? "true" : "false");
    document.getElementById("modeFile").setAttribute("aria-pressed", cam ? "false" : "true");
    document.getElementById("camView").hidden = !cam;
    document.getElementById("dropView").hidden = cam;
  }
  document.getElementById("modeCam").addEventListener("click", function () { setMode(true); });
  document.getElementById("modeFile").addEventListener("click", function () { setMode(false); });

  var drop = document.getElementById("dropView");
  ["dragenter", "dragover"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
  ["dragleave", "drop"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); }); });
  drop.addEventListener("drop", function (e) { Array.prototype.forEach.call(e.dataTransfer.files, function () { addPage(); }); });
  document.getElementById("fileInput").addEventListener("change", function () {
    Array.prototype.forEach.call(this.files, function () { addPage(); });
    if (this.files.length) toast(i18n(this.files.length === 1 ? "submit.photos1Toast" : "submit.photosNToast", { n: this.files.length }));
    this.value = "";
  });

  document.getElementById("sendBtn").addEventListener("click", function (e) {
    if (this.getAttribute("aria-disabled") === "true") { e.preventDefault(); toast(i18n("submit.retakeToast")); }
  });

  document.addEventListener("studentlang", render);

  render();
</script>
</body>
</html>
