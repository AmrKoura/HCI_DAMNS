<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Sprout · Class 3B</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/teacher.css">
<style>
  .cb { width: 20px; height: 20px; accent-color: var(--indigo); cursor: pointer; }
  .stu { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .stu .av { width: 34px; height: 34px; border-radius: 50%; background: var(--indigo-50); color: var(--indigo); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .step { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .st1 { background: var(--unsure-100); color: var(--unsure); }
  .st2 { background: var(--indigo-50); color: var(--indigo); }
  .st3 { background: var(--flag-100); color: var(--flag); }
  .st4 { background: var(--mint-100); color: var(--mint-700); }
  .st5 { background: var(--surface-2); color: var(--muted); }
  tr.sel td { background: var(--apricot-100); }
  tr.missing td { background: var(--surface-2); color: var(--muted); }
  tr.missing .stu .av { background: var(--line); color: var(--muted); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .acts .btn { min-height: 34px; padding: 0 12px; font-size: 13px; }
  .selbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<header class="t-top" data-active="papers"></header>
<main class="t-main">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="papers.html">Papers</a><i data-lucide="chevron-right" class="i-sm"></i><a href="test.html">Math Test 3</a><i data-lucide="chevron-right" class="i-sm"></i><span>Class 3B</span></nav>
  <div class="t-head">
    <div><h1>Math Test 3 · Class 3B</h1><p>22 of 23 submitted · Check text 4 · Confirm grade 12 · Red flags 2 · Release 4</p></div>
    <div class="selbar">
      <span class="muted" id="selText" style="font-size:14px">No papers selected</span>
      <a class="btn btn-accent" id="corrSel" href="bulk.html" hidden><i data-lucide="layers" class="i-sm"></i><span>Correct selected</span></a>
      <a class="btn btn-primary" href="bulk.html"><i data-lucide="layers" class="i-sm"></i>Correct all 22</a>
    </div>
  </div>

  <section class="box">
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th style="width:48px"><input type="checkbox" class="cb" id="all" aria-label="Select all papers"></th><th>Student</th><th>Step it is at</th><th>Details</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="muted box-pad" style="font-size:14px;border-top:1px solid var(--line)">Showing 11 of 23 students</p>
  </section>
</main>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="../js/teacher.js"></script>
<script src="../js/app.js"></script>
<script>
  var list = [
    { n: "Lina A.", st: 2, d: "AI total 14 / 20", a: "Continue" },
    { n: "Omar B.", st: 2, d: "AI total 12 / 20", a: "Continue" },
    { n: "Mia C.", st: 4, d: "Confirmed 18 / 20", a: "Continue" },
    { n: "Youssef D.", st: 5, d: "Released 8 Oct", a: "View" },
    { n: "Hana E.", st: 3, d: "1 red flag: borrowing", a: "Continue" },
    { n: "Karim F.", miss: true },
    { n: "Sara G.", st: 1, d: "3 unsure words", a: "Start" },
    { n: "Adam H.", st: 1, d: "1 unsure word", a: "Start" },
    { n: "Nour I.", st: 2, d: "AI total 17 / 20", a: "Continue" },
    { n: "Ali J.", st: 5, d: "Released 8 Oct", a: "View" },
    { n: "Laila K.", st: 2, d: "AI total 15 / 20", a: "Continue" }
  ];
  var names = ["", "1 · Check text", "2 · Confirm grade", "3 · Red flags", "4 · Ready to release", "Released"];
  var icons = ["", "scan-text", "list-checks", "flag", "send", "circle-check"];
  var sel = {};
  function selectable(x) { return !x.miss && x.st !== 5; }

  function render() {
    document.getElementById("rows").innerHTML = list.map(function (x, i) {
      var ini = x.n.split(" ").map(function (p) { return p[0]; }).join("");
      if (x.miss) {
        return '<tr class="missing"><td><input type="checkbox" class="cb" disabled aria-label="Not submitted"></td><td><span class="stu"><span class="av">' + ini + "</span>" + x.n + '</span></td><td><span class="step st5"><i data-lucide="circle-dashed" class="i-sm"></i>Not submitted</span></td>' +
          '<td colspan="2"><div class="acts"><button class="btn btn-ghost" data-act="remind"><i data-lucide="bell-ring" class="i-sm"></i>Remind student</button><a class="btn btn-ghost" href="messages.html"><i data-lucide="message-circle" class="i-sm"></i>Message parent</a><button class="btn btn-ghost" data-act="upload"><i data-lucide="upload" class="i-sm"></i>Upload for student</button></div></td></tr>';
      }
      return '<tr class="' + (sel[i] ? "sel" : "") + '"><td><input type="checkbox" class="cb" data-i="' + i + '"' + (sel[i] ? " checked" : "") + (selectable(x) ? "" : " disabled") + ' aria-label="Select ' + x.n + '"></td>' +
        '<td><span class="stu"><span class="av">' + ini + "</span>" + x.n + "</span></td>" +
        '<td><span class="step st' + x.st + '"><i data-lucide="' + icons[x.st] + '" class="i-sm"></i>' + names[x.st] + "</span></td>" +
        '<td class="muted">' + x.d + '</td><td style="text-align:right"><a class="btn btn-quiet" href="correct.html" style="min-height:34px">' + x.a + '<i data-lucide="chevron-right" class="i-sm"></i></a></td></tr>';
    }).join("");
    var n = Object.keys(sel).filter(function (k) { return sel[k]; }).length;
    var total = list.filter(selectable).length;
    document.getElementById("selText").textContent = n ? n + " selected" : "No papers selected";
    document.getElementById("corrSel").hidden = !n;
    document.getElementById("corrSel").querySelector("span").textContent = "Correct selected (" + n + ")";
    document.getElementById("all").checked = n === total;
    refreshIcons();
  }
  document.getElementById("rows").addEventListener("change", function (e) {
    if (e.target.dataset.i !== undefined) { sel[e.target.dataset.i] = e.target.checked; render(); }
  });
  document.getElementById("rows").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    if (b.dataset.act === "remind") toast("Reminder sent to Karim F.");
    if (b.dataset.act === "upload") toast("Choose the scanned pages for Karim F.");
  });
  document.getElementById("all").addEventListener("change", function () {
    var on = this.checked; sel = {};
    if (on) list.forEach(function (x, i) { if (selectable(x)) sel[i] = true; });
    render();
  });
  render();
</script>
</body>
</html>
