<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Sprout · Correct Lina's paper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Gochi+Hand&display=swap">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/teacher.css">
<link rel="stylesheet" href="../css/correct.css">
</head>
<body class="work">
<header class="t-top" data-active="papers"></header>

<div class="w-sub">
  <div class="ttl">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="papers.html">Papers</a><i data-lucide="chevron-right" class="i-sm"></i><a href="test.html">Math Test 3</a><i data-lucide="chevron-right" class="i-sm"></i><a href="class.html">3B</a></nav>
    <b>Lina A.</b>
  </div>
  <div class="stepper" id="stepper" aria-label="Correcting steps"></div>
</div>

<div class="resume-bar" id="resume">
  <i data-lucide="history" class="i-sm"></i>
  <span class="grow">Welcome back. You checked the text yesterday, so we opened Confirm grade, where you stopped.</span>
  <button class="btn btn-ghost" id="hideResume" style="min-height:32px;font-size:13px">Got it</button>
</div>

<div class="w-body">
  <div class="w-main">
    <section class="scan" aria-label="Scanned paper">
      <div class="scan-h"><b id="scanName" style="font-size:15px">Lina A.</b><small>Scan · page 1 of 2</small></div>
      <div id="scanBody"></div>
      <div class="circle-acts" id="circleActs" hidden>
        <button class="btn btn-primary" onclick="toast('Circle approved')"><i data-lucide="check" class="i-sm"></i>Approve circle</button>
        <button class="btn btn-ghost" onclick="toast('Drag the circle to move it')">Move</button>
        <button class="btn btn-ghost" onclick="toast('This mistake will not be shown')">Don't show</button>
      </div>
    </section>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>
</div>

<footer class="w-foot">
  <button class="btn btn-ghost" id="prevStep"><i data-lucide="arrow-left" class="i-sm"></i>Previous step</button>
  <div class="mid"><span class="saved"><i data-lucide="cloud-check" class="i-sm"></i>Saved. This paper reopens at the step where you stop.</span></div>
  <button class="btn btn-primary btn-lg" id="primary"></button>
</footer>

<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="../js/teacher.js"></script>
<script src="../js/app.js"></script>
<script>window.SINGLE = true;</script>
<script src="../js/correct.js"></script>
</body>
</html>
