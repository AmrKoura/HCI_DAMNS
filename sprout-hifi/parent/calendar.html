<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Sprout · Calendar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/parent.css">
<style>
  .lay { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; align-items: start; }
  .cal-h { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .cal-h h2 { font-size: 19px; font-weight: 800; flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .dow { padding: 10px 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--line); }
  .dow.we { color: var(--faint); }
  .cell { min-height: 104px; padding: 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
  .cell:nth-child(7n) { border-right: 0; }
  .cell.we { background: var(--surface-2); }
  .cell.blank { background: transparent; }
  .cell .n { font-size: 13px; font-weight: 700; color: var(--muted); width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
  .cell.today .n { background: var(--indigo); color: #fff; }
  .cell.today { box-shadow: inset 0 0 0 2px var(--indigo); }
  .evt { font-size: 12px; font-weight: 600; padding: 3px 7px; border-radius: 6px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .evt.exam { background: var(--indigo); color: #fff; }
  .evt.hw { background: var(--indigo-50); color: var(--indigo); }
  .evt.school { background: var(--apricot-100); color: #8A3E14; }
  .evt.off { background: var(--mint-100); color: var(--mint-700); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 14px 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; gap: 6px; align-items: center; }
  .legend i.sw { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
  .up { padding: 18px 20px; }
  .up h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .ue { display: flex; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); align-items: center; }
  .ue:first-of-type { border-top: 0; }
  .ue .day { width: 50px; text-align: center; flex-shrink: 0; border-radius: 12px; background: var(--surface-2); padding: 5px 0; }
  .ue .day small { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .ue .day b { font-size: 18px; color: var(--indigo); }
  .ue .grow { flex: 1; min-width: 0; }
  .ue b.t { display: block; font-size: 14.5px; }
  @media (max-width: 1000px) { .lay { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { .cell { min-height: 64px; padding: 4px; } .evt { font-size: 0; height: 6px; padding: 0; border-radius: 3px; } .dow { font-size: 10px; padding: 8px 4px; } }
</style>
</head>
<body>
<header class="p-top" data-active="calendar"></header>
<main class="p-main">
  <div class="p-head">
    <div><h1>Calendar</h1><p>Exams, homework and school events for Lina.</p></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <label for="subj" style="position:absolute;left:-9999px">Subject</label>
      <select class="select" id="subj"><option>All subjects</option><option>Math</option><option>Science</option><option>German</option><option>English</option></select>
      <button class="btn btn-ghost" id="sync"><i data-lucide="calendar-plus" class="i-sm"></i>Add to my phone calendar</button>
    </div>
  </div>
  <div class="lay">
    <section class="pbox" aria-label="October 2026">
      <div class="cal-h">
        <button class="icon-btn" id="prev" aria-label="Previous month"><i data-lucide="chevron-left" class="i-sm"></i></button>
        <h2>October 2026</h2>
        <button class="icon-btn" id="next" aria-label="Next month"><i data-lucide="chevron-right" class="i-sm"></i></button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span><i class="sw" style="background:var(--indigo)"></i>Exam or test</span>
        <span><i class="sw" style="background:var(--indigo-50);border:1px solid var(--indigo-100)"></i>Homework</span>
        <span><i class="sw" style="background:var(--apricot-100)"></i>School event</span>
        <span><i class="sw" style="background:var(--mint-100)"></i>Holiday</span>
      </div>
    </section>
    <aside class="pbox up" aria-label="Upcoming">
      <h2>Upcoming</h2>
      <div id="up"></div>
    </aside>
  </div>
</main>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/parent.js"></script>
<script>
  var ev = [
    { d: 6, t: "Armed Forces Day", k: "off", s: "School" },
    { d: 7, t: "Math Test 3", k: "exam", s: "Math" },
    { d: 12, t: "Homework 6", k: "hw", s: "Math" },
    { d: 14, t: "German reading test", k: "exam", s: "German" },
    { d: 15, t: "Math Test 4", k: "exam", s: "Math" },
    { d: 20, t: "Zoo trip", k: "school", s: "Science" },
    { d: 22, t: "Parents' evening", k: "school", s: "School" },
    { d: 27, t: "English spelling test", k: "exam", s: "English" },
    { d: 29, t: "Math Test 5", k: "exam", s: "Math" }
  ];
  var later = [{ w: "Sun", d: "1-5", m: "Nov", t: "Autumn break", s: "School", k: "off" }];
  var DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], TODAY = 9;
  function render() {
    var f = document.getElementById("subj").value, all = f === "All subjects";
    var E = ev.filter(function (e) { return all || e.s === f || e.s === "School"; });
    var html = DOW.map(function (d, i) { return '<div class="dow' + (i > 4 ? " we" : "") + '">' + d + "</div>"; }).join("");
    var first = 4; // 1 Oct 2026 is a Thursday
    for (var b = 0; b < first; b++) html += '<div class="cell blank" aria-hidden="true"></div>';
    for (var d = 1; d <= 31; d++) {
      var col = (first + d - 1) % 7;
      var day = E.filter(function (e) { return e.d === d; });
      html += '<div class="cell' + (col > 4 ? " we" : "") + (d === TODAY ? " today" : "") + '"' + (d === TODAY ? ' aria-current="date"' : "") + '><span class="n">' + d + "</span>" +
        day.map(function (e) { return '<span class="evt ' + e.k + '" title="' + e.t + '">' + e.t + "</span>"; }).join("") + "</div>";
    }
    var rest = (first + 31) % 7; if (rest) for (var r = rest; r < 7; r++) html += '<div class="cell blank" aria-hidden="true"></div>';
    document.getElementById("grid").innerHTML = html;

    var up = E.filter(function (e) { return e.d >= TODAY; }).map(function (e) {
      return { w: DOW[(first + e.d - 1) % 7], d: e.d, t: e.t, s: e.s, m: "Oct" };
    }).concat(later);
    document.getElementById("up").innerHTML = up.map(function (e) {
      return '<div class="ue"><span class="day"><small>' + e.w + "</small><b>" + e.d + '</b></span><span class="grow"><b class="t">' + e.t + '</b><span class="muted" style="font-size:13px">' + e.m + " · " + e.s + "</span></span></div>";
    }).join("");
    refreshIcons();
  }
  document.getElementById("subj").onchange = render;
  document.getElementById("prev").onclick = document.getElementById("next").onclick = function () { toast("This prototype shows October 2026 only"); };
  document.getElementById("sync").onclick = function () { toast("Calendar link copied. Open it on your phone to add Lina's dates."); };
  render();
</script>
</body>
</html>
